name: Kashafdeals Scraper

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests "telethon==1.36.0"

      - name: Run scraper
        env:
          TELEGRAM_API_ID:  ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          BOT_TOKEN:        ${{ secrets.BOT_TOKEN }}
          DEST_CHANNEL:     ${{ secrets.DEST_CHANNEL }}
          AFFILIATE_TAG:    ${{ secrets.AFFILIATE_TAG }}
          CHANNELS:         ${{ secrets.CHANNELS }}
        run: python scraper.py

      - name: Save state back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state: update last seen IDs"
          git pull --rebase && git push
