name: Combo Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: arkhashom-telegram-session
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests Pillow

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state_combo.json
          key: state-combo-${{ github.run_id }}
          restore-keys: |
            state-combo-

      - name: Run combo scraper
        env:
          TELEGRAM_API_ID:    ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:  ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:   ${{ secrets.TELEGRAM_SESSION_COMBO }}
          BOT_TOKEN:          ${{ secrets.BOT_TOKEN_COMBO }}
          DEST_CHANNEL:       "@arkhashomoffers"
          AFFILIATE_TAG:      "arkhashom-21"
          CHANNELS:           ${{ secrets.CHANNELS }}
          ALL_CHANNELS:       ${{ secrets.ALL_CHANNELS }}
          NO_PHOTO_CHANNELS:  ${{ secrets.NO_PHOTO_CHANNELS }}
          SCRAPE_MODE:        combo
          STATE_FILE:         state_combo.json
          BANNER_PATH:        arkhashom_banner.png
        run: python scraper_combo.py

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state_combo.json
          key: state-combo-${{ github.run_id }}
