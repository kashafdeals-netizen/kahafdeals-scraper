name: Arkhashom Forward-All Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: combo-all-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests "telethon==1.36.0" Pillow

      - name: Run forward-all scraper
        env:
          TELEGRAM_API_ID:    ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:  ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:   ${{ secrets.TELEGRAM_SESSION_ALL || secrets.TELEGRAM_SESSION_COMBO }}
          BOT_TOKEN:          ${{ secrets.BOT_TOKEN_COMBO }}
          DEST_CHANNEL:       "@arkhashomoffers"
          AFFILIATE_TAG:      "arkhashom-21"
          ALL_CHANNELS:       ${{ secrets.ALL_CHANNELS }}
          SCRAPE_MODE:        "all"
          STATE_FILE:         "state_all.json"
          BANNER_PATH:        "arkhashom_banner.png"
        run: python scraper_combo.py

      - name: Save state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_all.json
          git diff --staged --quiet || git commit -m "state: update forward-all scraper"
          git pull origin main --no-rebase -X ours || true
          git push origin main
