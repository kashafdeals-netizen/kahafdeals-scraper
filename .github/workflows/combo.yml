name: Arkhashom Combo Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests "telethon==1.36.0"

      - name: Run combo scraper
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:  ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:   ${{ secrets.TELEGRAM_SESSION_COMBO }}
          BOT_TOKEN:          ${{ secrets.BOT_TOKEN }}
          DEST_CHANNEL:       "@arkhashomoffers"
          AFFILIATE_TAG:      "arkhashom-21"
          CHANNELS:           ${{ secrets.CHANNELS }}
        run: python scraper_combo.py

      - name: Save state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_combo.json
          git diff --staged --quiet || git commit -m "state: update combo scraper"
          git pull origin main --no-rebase -X ours || true
          git push origin main
