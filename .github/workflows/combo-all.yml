name: Combo Scraper - Forward All

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: combo-forward-all
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests Pillow

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state_all.json
          key: state-all-${{ github.run_id }}
          restore-keys: |
            state-all-

      - name: Run forward-all scraper
        env:
          TELEGRAM_API_ID:    ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:  ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:   ${{ secrets.TELEGRAM_SESSION_ALL || secrets.TELEGRAM_SESSION_COMBO }}
          BOT_TOKEN:          ${{ secrets.BOT_TOKEN_COMBO }}
          DEST_CHANNEL:       "@arkhashomoffers"
          AFFILIATE_TAG:      ${{ secrets.AFFILIATE_TAG }}
          ALL_CHANNELS:       ${{ secrets.ALL_CHANNELS }}
          NO_PHOTO_CHANNELS:  ${{ secrets.NO_PHOTO_CHANNELS }}
          SCRAPE_MODE:        all
          STATE_FILE:         state_all.json
          BANNER_PATH:        arkhashom_banner.png
        run: python scraper_combo.py

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state_all.json
          key: state-all-${{ github.run_id }}
